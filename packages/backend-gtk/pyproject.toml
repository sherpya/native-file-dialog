[project]
name = "native-file-dialog-gtk"
description = "GTK4 backend for native-file-dialog"
readme = "README.md"
authors = [
  { name = "Gianluigi Tiesi", email = "sherpya@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["native-file-dialog"]

[build-system]
requires = ["scikit-build-core>=1.0", "pkgconfig"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = []

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>.+)$"
