[project]
name = "native-file-dialog-gtk3"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["native-file-dialog"]

[build-system]
requires = ["scikit-build-core", "pkgconfig"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = []

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>.+)$"
