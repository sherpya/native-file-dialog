[project]
name = "native-file-dialog"
version = "1.0.0"
description = "Native file dialogs (open/save, single and multiple) via Qt/GTK on Linux, ctypes on Windows, osascript/PyObjC on macOS, with tkinter fallback."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Gianluigi Tiesi", email = "sherpya@gmail.com" }]
keywords = ["file-dialog", "native", "open-file", "save-file", "cross-platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = [
    "pyobjc-framework-cocoa>=11.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-uniformtypeidentifiers>=11.1 ; sys_platform == 'darwin'",
]

[build-system]
requires = ["scikit-build-core>=0.5", "pybind11"]
build-backend = "scikit_build_core.build"

[project.optional-dependencies]
macos-native = ["pyobjc-framework-Cocoa", "pyobjc-framework-uniformtypeidentifiers"]

[project.urls]
Repository = "https://github.com/example/native-file-dialog"

[tool.scikit-build]
wheel.packages = ["src/native_file_dialog"]
wheel.cmake = false
editable.rebuild = false

[[tool.scikit-build.overrides]]
if.platform-system = "linux"
wheel.cmake = true

[tool.hatch.build.targets.wheel]
packages = ["src/native_file_dialog"]
