name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build core sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
        working-directory: packages/core
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist/*

  gtk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Build GTK4 wheel in Docker
        run: |
          docker build \
            -f docker/gtk.Dockerfile \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t nfd-gtk:${{ matrix.python-version }} .
          docker run --rm \
            -v "$PWD/packages:/packages" \
            nfd-gtk:${{ matrix.python-version }} \
            python -m build --wheel
      - uses: actions/upload-artifact@v4
        if: ${{ env.ACT != 'true' }}
        with:
          name: gtk-dist-${{ matrix.python-version }}
          path: packages/backend-gtk/dist/*

  gtk3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Build GTK3 wheel in Docker
        run: |
          docker build \
            -f docker/gtk3.Dockerfile \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t nfd-gtk3:${{ matrix.python-version }} .
          docker run --rm \
            -v "$PWD/packages:/packages" \
            nfd-gtk3:${{ matrix.python-version }} \
            python -m build --wheel
      - uses: actions/upload-artifact@v4
        if: ${{ env.ACT != 'true' }}
        with:
          name: gtk3-dist-${{ matrix.python-version }}
          path: packages/backend-gtk3/dist/*

  qt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Build Qt wheel in Docker
        run: |
          docker build \
            -f docker/qt.Dockerfile \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t nfd-qt:${{ matrix.python-version }} .
          docker run --rm \
            -v "$PWD/packages/backend-qt:/project" \
            nfd-qt:${{ matrix.python-version }} \
            python -m build
      - uses: actions/upload-artifact@v4
        if: ${{ env.ACT != 'true' }}
        with:
          name: qt-dist-${{ matrix.python-version }}
          path: packages/backend-qt/dist/*

  publish:
    runs-on: ubuntu-latest
    needs: [core, gtk, gtk3, qt]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-dist*"
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
